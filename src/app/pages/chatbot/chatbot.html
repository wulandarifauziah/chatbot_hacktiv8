<div class="chatbot-container" [class.dark]="isDarkMode">
  <!-- Header -->
  <div class="chat-header">
    <div class="header-content" routerLink="/" style="cursor: pointer;">
      <div class="bot-avatar">
        <span>🎓</span>
      </div>
      <div class="header-text">
        <h2>EduAssist</h2>
        <span class="status">
          <span class="status-dot"></span>
          AI Powered • Online
        </span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn theme-toggle" (click)="toggleTheme()" title="Toggle Theme">
        <!-- Sun icon (shown in dark mode) -->
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Chat Messages -->
  <div class="chat-messages" #chatContainer>
    <div class="messages-wrapper">
      @for (message of messages; track message.id) {
        <div class="message" [class.user-message]="message.isUser" [class.bot-message]="!message.isUser">
          @if (!message.isUser) {
            <div class="bot-avatar-small">🎓</div>
          }
          <div class="message-content">
            <div class="message-text" [innerHTML]="formatText(getCleanText(message))"></div>
          </div>
        </div>
      }

      <!-- Typing Indicator -->
      @if (isTyping) {
        <div class="message bot-message">
          <div class="bot-avatar-small">🎓</div>
          <div class="message-content">
            <div class="typing-indicator">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Quick Reply Bar -->
  <div class="quick-reply-bar">
    <button class="quick-bar-btn" (click)="onQuickReply('jadwal')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      Jadwal
    </button>
    <button class="quick-bar-btn" (click)="onQuickReply('krs')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
      KRS
    </button>
    <button class="quick-bar-btn" (click)="onQuickReply('nilai')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      Nilai
    </button>
    <button class="quick-bar-btn" (click)="onQuickReply('ukt')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      UKT
    </button>
    <button class="quick-bar-btn" (click)="onQuickReply('skripsi')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      Skripsi
    </button>
    <button class="quick-bar-btn" (click)="onQuickReply('beasiswa')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
      Beasiswa
    </button>
    <button class="quick-bar-btn" (click)="onQuickReply('cuti')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      Cuti
    </button>
  </div>

  <!-- Floating Input Area -->
  <div class="chat-input-area">
    <div class="input-wrapper">
      <input 
        type="text" 
        class="chat-input" 
        placeholder="Ketik pertanyaan Anda..." 
        [(ngModel)]="userInput"
        (keypress)="onKeyPress($event)"
        autocomplete="off"
      />
      <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput.trim()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>
